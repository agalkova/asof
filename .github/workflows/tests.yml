name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asof
          POSTGRES_PASSWORD: asof-test
          POSTGRES_DB: asof_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asof -d asof_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      ASOF_TEST_DATABASE_URL: postgresql://asof:asof-test@localhost:5432/asof_test
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[api,postgres]"
      - run: python -m unittest discover -s tests -v
