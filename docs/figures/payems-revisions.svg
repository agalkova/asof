    <dc:title>August 2008 payroll employment as published over time</dc:title>
    <dc:description>The first published value was 137,473 thousand jobs in September 2008. Revisions lowered it to 136,741 thousand by February 2010, then raised it again; the current value, published in February 2025, is 137,211 thousand.</dc:description>
