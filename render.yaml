services:
  - type: web
    name: asof-api
    runtime: docker
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    preDeployCommand: asof init-db
    envVars:
      - key: ASOF_DATABASE_URL
        fromDatabase:
          name: asof-db
          property: connectionString

  - type: cron
    name: asof-sync-payems
    runtime: docker
    region: ohio
    dockerfilePath: ./Dockerfile
    schedule: "0 12 * * *"
    dockerCommand: asof refresh --series PAYEMS --lookback-months 24
    envVars:
      - key: ASOF_DATABASE_URL
        fromDatabase:
          name: asof-db
          property: connectionString
      - key: FRED_API_KEY
        sync: false

databases:
  - name: asof-db
    databaseName: asof
    user: asof
    region: ohio
    ipAllowList: []
