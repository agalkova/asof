[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asof-economic-data"
version = "0.9.1"
description = "Point-in-time queries for revised economic data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "python-dotenv>=1,<2",
  "requests>=2.31,<3",
]

[project.scripts]
asof = "asof.cli:main"

[project.optional-dependencies]
notebook = [
  "ipykernel>=6,<8",
  "jupyterlab>=4,<5",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
api = [
  "fastapi>=0.162,<1",
  "httpx2>=2.16,<3",
  "uvicorn>=0.34,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
