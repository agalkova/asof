[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asof-economic-data"
version = "0.1.0"
description = "Point-in-time queries for revised economic data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "requests>=2.31,<3",
]

[project.optional-dependencies]
notebook = [
  "ipykernel>=6,<8",
  "jupyterlab>=4,<5",
  "pandas>=2.2,<4",
  "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
